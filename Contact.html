<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            font-weight: bold;
        }
        form {
            width: 300px;
        }
        input, textarea {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
        }
        textarea {
            height: 60px;
        }
        button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <h1>HTML Forms</h1>

    <form action="#" method="post">
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="firstname" placeholder="John"><br>

        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lastname" placeholder="Doe"><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message">Please insert message here!</textarea><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
